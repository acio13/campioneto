[build]
  command = "npm run build"
  publish = "dist/campioneto/browser"
  functions = "netlify/functions"

[build.environment]
  NETLIFY_SKIP_ANGULAR_RUNTIME = "true"
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm start -- --port 4200"
  targetPort = 4200
  port = 8888
  autoLaunch = false

[[redirects]]
  from = "/api/championship"
  to = "/.netlify/functions/championship"
  status = 200
  force = true

[[redirects]]
  from = "/api/results"
  to = "/.netlify/functions/results"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
